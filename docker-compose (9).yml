version: '3.8'
services:
  postgres:
    image: postgres:17-alpine
    container_name: banking_sql_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banking_dwh
    ports:
      - "5432:5432"
    volumes:
      - banking_pgdata:/var/lib/postgresql/data
      - ./01_schema_and_seed.sql:/docker-entrypoint-initdb.d/01_schema_and_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_dwh"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  banking_pgdata:
